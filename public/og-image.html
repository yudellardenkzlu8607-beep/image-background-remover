<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OG Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .logo {
            font-size: 80px;
            margin-bottom: 30px;
        }
        .title {
            font-size: 56px;
            font-weight: bold;
            color: white;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .subtitle {
            font-size: 28px;
            color: rgba(255,255,255,0.9);
            text-align: center;
        }
        .url {
            position: absolute;
            bottom: 40px;
            font-size: 24px;
            color: rgba(255,255,255,0.7);
        }
    </style>
</head>
<body>
    <div class="logo">🖼️</div>
    <div class="title">Image Background Remover</div>
    <div class="subtitle">AI 去除图片背景 · 1 秒完成 · 免费使用</div>
    <div class="url">image-background-remover.space</div>
</body>
</html>
